name: Jira Scenario II CIon:  workflow_dispatch:    inputs:      confirm_run:        description: "Type 'yes' to run this credit-consuming workflow"        required: true        default: "no"        type: choice        options:          - no          - yesjobs:  jira-scenario-ii:    if: ${{ github.event.inputs.confirm_run == 'yes' }}    runs-on: ubuntu-latest    timeout-minutes: 45    env:      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}      JIRA_URL: ${{ secrets.JIRA_URL }}      JIRA_USERNAME: ${{ secrets.JIRA_USERNAME }}      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}      RUN_JIRA_SCENARIO_II_TESTS: "true"      PYTHONUNBUFFERED: "1"    steps:      - name: Checkout repository        uses: actions/checkout@v4      - name: Setup Python        uses: actions/setup-python@v5        with:          python-version: "3.12"          cache: "pip"      - name: Setup Node.js for npx tools        uses: actions/setup-node@v4        with:          node-version: "20"      - name: Setup uv (for uvx)        uses: astral-sh/setup-uv@v3      - name: Install Python dependencies        run: |          python -m pip install --upgrade pip          pip install -r requirements.txt          pip install pytest pytest-asyncio      - name: Validate required secrets are configured        shell: bash        run: |          missing=0          for key in ANTHROPIC_API_KEY JIRA_URL JIRA_USERNAME JIRA_API_TOKEN; do            if [ -z "${!key}" ]; then              echo "::error::Missing required secret: $key"              missing=1            fi          done          if [ "$missing" -ne 0 ]; then            exit 1          fi      - name: Run Jira scenario tests        run: |          pytest -v tests/test_jira_scenario.py      - name: Verify generated Playwright test exists        run: |          test -f output/tests/greenkart.spec.ts      - name: Upload generated Playwright test artifact        if: always()        uses: actions/upload-artifact@v4        with:          name: greenkart-spec          path: output/tests/greenkart.spec.ts          if-no-files-found: warn